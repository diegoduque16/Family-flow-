name = "family-flow-app"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/cal/*"]

[[d1_databases]]
binding = "DB"
database_name = "family-flow"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "family-flow-backups"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *", "17 3 * * *"]

[vars]
ADMIN_EMAILS = "diego.duque@nyu.edu"
VAPID_SUBJECT = "mailto:diego.duque@nyu.edu"

[observability]
enabled = true

# Secrets (set in the Cloudflare dashboard → Worker → Settings → Variables and Secrets, type "Secret"):
#   ANTHROPIC_API_KEY   – required for the assistant
#   GEOAPIFY_API_KEY    – recommended for address search (free tier 3,000 req/day); falls back to Photon without it
# Optional: ANTHROPIC_MODEL to pin a model id.
