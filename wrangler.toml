name = "family-flow-app"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Keep variables/secrets added in the Cloudflare dashboard when GitHub pushes redeploy.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/cal/*"]

[[d1_databases]]
binding = "DB"
database_name = "family-flow"
database_id = "510bc377-721e-429f-a663-44a49cf55f41"
migrations_dir = "migrations"

# Daily backups to R2: enable R2 in the dashboard (free tier, needs a card on file), create the
# bucket "family-flow-backups", then uncomment these three lines. Until then D1 Time Travel (30 days) is the backup.
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "family-flow-backups"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *", "17 3 * * *"]

[vars]
ADMIN_EMAILS = "diego.duque@nyu.edu"
VAPID_SUBJECT = "mailto:diego.duque@nyu.edu"

[observability]
enabled = true

# Secrets (set in the Cloudflare dashboard → Worker → Settings → Variables and Secrets, type "Secret"):
#   ANTHROPIC_API_KEY   – required for the assistant
#   GEOAPIFY_API_KEY    – recommended for address search (free tier 3,000 req/day); falls back to Photon without it
# Optional: ANTHROPIC_MODEL to pin a model id.
